name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/ci-workflows--plugin-pr-check.yml
    permissions:
      contents: read
      checks: write

  security:
    uses: ./.github/workflows/ci-workflows--common-security-scan.yml
    permissions:
      contents: read

  pr-gate:
    name: PR Gate
    if: always()
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and (to_entries | all(.value.result == "success"))' <<< "$NEEDS" > /dev/null
