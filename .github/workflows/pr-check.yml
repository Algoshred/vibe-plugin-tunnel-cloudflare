# vendored from algoshred/ci-workflows@c3f35eb994c2b554eb1a3c61b7ee12e2a687521c
# source: templates/plugin/pr-check.yml. Do not edit: regenerate with scripts/vendor.ts in algoshred/ci-workflows.
# PR check caller for a public vibe plugin (plan sections 8.2, 8.3 and 10.7).
#
# Plugin repositories are public, so this template is never pinned with
# scripts/repin.ts: it is vendored with scripts/vendor.ts, which copies the
# reusable workflows and composite actions it uses into the repository and
# rewrites the `uses:` lines to local paths:
#
#   bun scripts/vendor.ts --dest <clone> --template plugin/pr-check.yml \
#     --template plugin/release.yml --ref <sha> --version <vYYYY.MDD.N or date>
#
# `PR Gate` is the only required check. It stays in this file with the job id
# `pr-gate`, runs `if: always()`, and fails unless every job it needs
# succeeded. Never add `paths`/`paths-ignore` to this workflow. Repository
# specific jobs go above `pr-gate` and into its `needs`. AI review jobs that a
# repository kept in this file are appended after `pr-gate` unchanged (the
# caller is repository-owned; only the vendored dependencies are checksummed).
name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/ci-workflows--plugin-pr-check.yml
    permissions:
      contents: read
      checks: write

  security:
    uses: ./.github/workflows/ci-workflows--common-security-scan.yml
    permissions:
      contents: read

  pr-gate:
    name: PR Gate
    if: always()
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS"
          jq -e 'length > 0 and (to_entries | all(.value.result == "success"))' <<< "$NEEDS" > /dev/null
  # ai-review-standard: v4
  claude-review:
    name: Claude Code Review
    needs: [pr-gate]
    if: github.event_name == 'pull_request' && needs.pr-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for code quality, bugs, security, performance, and test coverage.
            Use the repository's CLAUDE.md / AGENTS.md for style and conventions when present.
            Do not modify files. Only post GitHub comments.

            Post exactly ONE top-level summary via `gh pr comment`. Begin it with this exact heading (first line):
            **AI Review — Claude Opus 4.6** (`claude-opus-4-6`)

            For each specific issue on a changed line, use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
            Put finding details (tags, explanation) in inline comments; keep the summary brief (counts + highest-severity items).
            Tag findings with [BUG], [SECURITY], [IMPROVEMENT], [BEST PRACTICE] and [LOW], [MEDIUM], or [HIGH].
            If there are no meaningful issues, say "No issues found. Good job!" in the summary only.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr list:*)"
            --model claude-opus-4-6

  opencode-minimax-review:
    name: OpenCode Review (Minimax M2.7)
    needs: [pr-gate]
    if: vars.AI_REVIEW_OPENCODE_ENABLED == 'true' && github.event_name == 'pull_request' && needs.pr-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: OpenCode review (Minimax M2.7)
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        with:
          model: minimax/MiniMax-M2.7
          use_github_token: true
          share: false
          prompt: |
            Your entire response is posted as exactly ONE GitHub PR comment. Do not use tools to post comments.
            Inline diff comments are not available for OpenCode; cite file paths and line numbers in the comment body.

            Begin the comment with this exact heading (first line):
            **AI Review — Minimax M2.7** (`minimax/MiniMax-M2.7`)

            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs and security issues
            - Suggest improvements and best practices
            - Don't modify any files
            - Tag each finding with [BUG], [SECURITY], [IMPROVEMENT], [BEST PRACTICE] and [LOW], [MEDIUM], or [HIGH]
            - If there are no issues, say "No issues found. Good job!"

