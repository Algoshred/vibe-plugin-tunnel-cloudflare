# PR check caller for a public vibe plugin (plan sections 8.2, 8.3 and 10.7).
#
# Plugin repositories are public, so this template is never pinned with
# scripts/repin.ts: it is vendored with scripts/vendor.ts, which copies the
# reusable workflows and composite actions it uses into the repository and
# rewrites the `uses:` lines to local paths:
#
#   bun scripts/vendor.ts --dest <clone> --template plugin/pr-check.yml \
#     --template plugin/release.yml --ref <sha> --version <vYYYY.MDD.N or date>
#
# `PR Gate` is the only required check. It stays in this file with the job id
# `pr-gate`, runs `if: always()`, and fails unless every job it needs
# succeeded. Never add `paths`/`paths-ignore` to this workflow. Repository
